
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: collab_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: collab_editor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab_user -d collab_editor"]
      interval: 5s
      timeout: 5s
      retries: 10
  

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://collab_user:${POSTGRES_PASSWORD}@postgres:5432/collab_editor
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # lets the API start sandbox containers on the host
    # --root-path: Caddy strips /api, this keeps generated redirects/docs URLs correct behind it
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --root-path /api --proxy-headers --forwarded-allow-ips="*"

  sync-server:
    build: ./sync-server
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data        # keeps the TLS certificates across restarts
      - caddy_config:/config
    depends_on:
      - api
      - sync-server

volumes:
  pgdata:
  caddy_data:
  caddy_config:
