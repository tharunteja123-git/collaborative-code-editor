services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collab_user
      POSTGRES_PASSWORD: collab_pass
      POSTGRES_DB: collab_editor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./api
    env_file: ./api/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # lets the API spin up sandbox containers
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  sync-server:
    build: ./sync-server
    ports:
      - "1234:1234"

volumes:
  pgdata:
